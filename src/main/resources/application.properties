spring.application.name=online-examination-system


server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/online_examination_system
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

app.jwt.expiration-ms=900000


app.bootstrap.super-admin.enabled=${SUPER_ADMIN_BOOTSTRAP_ENABLED:false}

#app.security.super-admin-password-reset=${SUPER_ADMIN_PASSWORD_RESET_ENABLED:false}